<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title> ADBD 0783 Examen</title>
    <style>
        body {
            background-color: #ffffff;
            color: #222222;
            margin: 0;
            font-family: Arial, sans-serif;
        }

        .encabezado {
            font-family: sans-serif;
            background-color: #C40000;
            padding: 30px;
            text-align: center;
        }
        .logo {
            width: 100;
            height: 180;
        }

        .contenedor-tarjetas {
            display: flex;
            justify-content: center;
            gap: 20px;
            width: 80%;
            margin: 40px auto;
        }
        
        .tarjeta {
            background-color: #ffffff;
            border: 1px solid #C40000;
            padding: 20px;
            text-align: center;
            width: 30%;
            box-shadow: 2px 2px 8px rgba(0, 0, 0, 0.1);
        }

        .formulario {
            background-color: #C40000;
            border: 2px solid #8F8F8F;
            padding: 40px;
            width: 50%;
            margin: 40px auto;
            text-align: center;
        }

        .pie-pagina {
            background-color: #C40000;
            color: #ffffff;
            padding: 20px;
            text-align: center;
        }
    </style>
</head>
<body>

    <header class="encabezado">
        <h1>LEVIS</h1>
    </header>

    <div class="contenedor-tarjetas">
        <div class="tarjeta">
            <img src="mujimg1.jpg" alt="Vesito Mezclilla" width="150" height="120">
            <h2>Vesito Mezclilla</h2>
            <p>Vestido sencillo de mujer con mezclilla.</p>
        </div>
        
        <div class="tarjeta">
            <img src="mujimg2.jpg" alt="Pantalón" width="150" height="120">
            <h2>Pantalón</h2>
            <p>Pantalón Baggy de mujer, con la mejor mezclilla.</p>
        </div>
        
        <div class="tarjeta">
            <img src="mujimg3.jpg" alt="Blusa" width="150" height="120">
            <h2>Blusa Rayas</h2>
            <p>Blusa a rayas gris, negra y blanca.</p>
        </div>
    </div>

    <div class="formulario">
        <h3>Registro</h3>
        <form onsubmit="saludarUsuario(event)">
            <label for="nombre">Ingresa tu nombre:</label>
            <br><br>
            <input type="text" id="nombre" name="nombre" size="40" required>
            <br><br>
            <input type="submit" value="Registrarse">
        </form>
        <br>
        <h2 id="mensaje-saludo"></h2>
    </div>

    <footer class="pie-pagina">
        <p>Adame Durán Brenda Denis 0783</p>
    </footer>

    <script>
        function saludarUsuario(evento) {
            evento.preventDefault(); 
            var nombreUsuario = document.getElementById('nombre').value;
            document.getElementById('mensaje-saludo').innerHTML = "¡Hola, " + nombreUsuario + "! Gracias por registrarte.";
            document.getElementById('nombre').value = "";
        }
    </script>

</body>
</html>
